<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モンスタービルド＆バトル</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a24; color: #f0f0f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 900px; width: 100%; background: #242432; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1, h2, h3 { text-align: center; color: #4db8ff; margin-top: 0; }
        
        .screen { display: none; }
        .active { display: block; }

        button { background: #3a3d52; color: #fff; border: 1px solid #5a5d78; border-radius: 6px; padding: 8px 16px; cursor: pointer; transition: all 0.2s; font-size: 14px; margin: 4px; }
        button:hover { background: #4a4d68; border-color: #4db8ff; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button.btn-primary { background: #007acc; border-color: #0099ff; font-weight: bold; }
        button.btn-primary:hover { background: #0099ff; }
        button.btn-danger { background: #a83232; border-color: #d94141; }
        button.btn-danger:hover { background: #d94141; }

        input[type="text"], select { background: #16161f; color: #fff; border: 1px solid #4a4d68; border-radius: 4px; padding: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }

        .header-status { background: #181824; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #33334d; }
        .monster-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .monster-card { background: #2a2a3c; border-radius: 8px; padding: 15px; border: 2px solid #3a3a52; position: relative; }
        .monster-card.active-mon { border-color: #4db8ff; }

        .slot-box { background: #1e1e2d; border-radius: 6px; padding: 8px; margin-top: 8px; border: 1px dashed #444466; }
        .slot-rarity-1 { border-color: #8c8c8c; color: #e0e0e0; }
        .slot-rarity-2 { border-color: #4caf50; color: #81c784; }
        .slot-rarity-3 { border-color: #2196f3; color: #64b5f6; }
        .slot-rarity-4 { border-color: #ff9800; color: #ffb74d; }

        .log-box { background: #12121a; border: 1px solid #33334d; border-radius: 6px; height: 180px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 13px; margin-bottom: 15px; }
        .log-line { margin-bottom: 4px; border-bottom: 1px solid #1a1a26; padding-bottom: 2px; }

        .battle-stage { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .fighter-box { background: #1a1a26; border-radius: 8px; padding: 15px; border: 2px solid #33334d; text-align: center; }
        .hp-bar-bg { background: #333; height: 16px; border-radius: 8px; overflow: hidden; margin: 10px 0; border: 1px solid #555; }
        .hp-bar-fill { background: #4caf50; height: 100%; width: 100%; transition: width 0.3s; }

        .starter-select-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .starter-card { background: #2a2a3c; border: 2px solid #444; border-radius: 6px; padding: 10px; cursor: pointer; text-align: center; flex: 1; }
        .starter-card.selected { border-color: #4db8ff; background: #323a52; }

        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-right: 4px; }
        .badge-1 { background: #555; }
        .badge-2 { background: #2e7d32; }
        .badge-3 { background: #1565c0; }
        .badge-4 { background: #ef6c00; }
    </style>
</head>
<body>

<div class="container">
    <h1>モンスタービルド＆バトル</h1>

    <!-- 画面1: モード選択 -->
    <div id="mode-screen" class="screen active">
        <h2>対戦モード選択</h2>
        <div style="max-width: 400px; margin: 0 auto; text-align: center;">
            <div style="margin-bottom: 20px;">
                <label>プレイヤー名:</label>
                <input type="text" id="player-name-input" value="プレイヤー1" placeholder="名前を入力">
            </div>
            <div style="margin-bottom: 15px;">
                <button class="btn-primary" style="width: 100%; padding: 12px;" onclick="startAIMode()">VS AI（ソロプレイ）</button>
            </div>
            <div>
                <button style="width: 100%; padding: 12px;" onclick="startPeerMode()">VS プレイヤー（PeerJS通信）</button>
            </div>
        </div>
    </div>

    <!-- 画面2: PeerJS ルーム設定 -->
    <div id="peer-screen" class="screen">
        <h2>通信対戦ルーム</h2>
        <div style="max-width: 400px; margin: 0 auto;">
            <p>あなたのID: <b id="my-peer-id" style="color:#4db8ff;">発行中...</b></p>
            <hr style="border-color:#333; margin: 15px 0;">
            <div style="margin-bottom: 10px;">
                <label>相手のIDを入力して接続:</label>
                <input type="text" id="target-peer-id" placeholder="相手のID">
            </div>
            <button class="btn-primary" style="width: 100%;" onclick="connectToPeer()">接続する</button>
            <p id="peer-status" style="text-align: center; color: #aaa; margin-top: 10px;">待機中...</p>
        </div>
    </div>

    <!-- 画面3: ビルド画面 -->
    <div id="build-screen" class="screen">
        <div class="header-status">
            <div>
                <strong>残りポイント:</strong> <span id="remaining-pt" style="color:#ffb74d; font-size:18px;">25</span> / 25 PT
            </div>
            <div>
                <strong>チーム合計★:</strong> <span id="party-stars" style="color:#4db8ff; font-size:18px;">0</span> / 6 ★
            </div>
            <div>
                <button class="btn-primary" onclick="finishBuild()">ビルド完了</button>
            </div>
        </div>

        <div class="monster-cards" id="monster-cards-container">
            <!-- JavaScriptで動的生成 -->
        </div>
    </div>

    <!-- 画面4: 対戦準備画面 (初手選択) -->
    <div id="pre-battle-room" class="screen">
        <h2>バトル準備</h2>
        <p style="text-align: center;">最初のバトルに出すモンスターを選んでください</p>
        <div class="starter-select-group" id="starter-select-list">
            <!-- JavaScriptで選択肢生成 -->
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn-primary" id="btn-ready-battle" onclick="setReadyToBattle()">決定＆相手の準備待ち</button>
            <p id="pre-battle-status" style="color:#aaa;"></p>
        </div>
    </div>

    <!-- 画面5: バトル画面 -->
    <div id="battle-screen" class="screen">
        <div class="battle-stage">
            <div class="fighter-box">
                <h3 id="my-mon-name">自分のモンスター</h3>
                <div id="my-mon-stats" style="font-size:12px; color:#aaa;"></div>
                <div class="hp-bar-bg"><div id="my-hp-bar" class="hp-bar-fill"></div></div>
                <div id="my-hp-text">100 / 100</div>
            </div>
            <div class="fighter-box">
                <h3 id="enemy-mon-name">相手のモンスター</h3>
                <div id="enemy-mon-stats" style="font-size:12px; color:#aaa;"></div>
                <div class="hp-bar-bg"><div id="enemy-hp-bar" class="hp-bar-fill"></div></div>
                <div id="enemy-hp-text">100 / 100</div>
            </div>
        </div>

        <div class="log-box" id="battle-log">
            <!-- ログ出力領域 -->
        </div>

        <div id="battle-controls" style="text-align: center;">
            <button class="btn-primary" id="btn-attack" onclick="handleAction('attack')">通常攻撃</button>
            <button id="btn-switch" onclick="openSwitchMenu()">モンスター交代</button>
        </div>

        <div id="switch-menu" style="display:none; margin-top: 15px; background: #2a2a3c; padding: 10px; border-radius: 6px; text-align: center;">
            <h4>交代先を選択</h4>
            <div id="switch-list" style="display: flex; gap: 10px; justify-content: center;"></div>
            <button onclick="closeSwitchMenu()" style="margin-top: 10px;">キャンセル</button>
        </div>
    </div>
</div>

<!-- PeerJS CDNs -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    const pre = NAME_PREFIXES[Math.floor(Math.random() * NAME_PREFIXES.length)];

// --- ゲーム状態変数 ---
let gameMode = "AI"; // "AI" or "PEER"
let playerName = "プレイヤー1";
let peer = null;
let conn = null;
let remainingPt = MAX_PT;

let monsters = [
    { name: "モンスター 1", currentStars: 0, slots: [], locks: {}, hasOverclocked: false, overclockedStats: {}, ivs: generateIVs() },
    { name: "モンスター 2", currentStars: 0, slots: [], locks: {}, hasOverclocked: false, overclockedStats: {}, ivs: generateIVs() },
    { name: "モンスター 3", currentStars: 0, slots: [], locks: {}, hasOverclocked: false, overclockedStats: {}, ivs: generateIVs() }
];

let playerTeam = [];
let enemyTeam = [];
let selectedStarterIdx = 0;
let isMyBuildReady = false;
let isOpponentBuildReady = false;
let isMyStarterReady = false;
let isOpponentStarterReady = false;

let pActiveIdx = 0;
let eActiveIdx = 0;
let currentTurn = 1;
let mySubmittedAction = null;
let opponentSubmittedAction = null;

// 個体値生成
function generateIVs() {
    return {
        hp: Math.floor(Math.random() * 31),
        atk: Math.floor(Math.random() * 31),
        def: Math.floor(Math.random() * 31),
        spd: Math.floor(Math.random() * 31)
    };
}

// 画面切り替え
function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

// AIモード開始
function startAIMode() {
    gameMode = "AI";
    initBuildScreen();
    showScreen('build-screen');
}

// PeerJSモード開始
function startPeerMode() {
    gameMode = "PEER";
    showScreen('peer-screen');
    initPeer();
}

// PeerJS初期化
function initPeer() {
    if (peer) return;
    peer = new Peer();
    peer.on('open', id => {
        document.getElementById('my-peer-id').innerText = id;
    });
    peer.on('connection', c => {
        conn = c;
        setupConnEvents();
        document.getElementById('peer-status').innerText = "接続成功！ビルド画面へ移動します...";
        setTimeout(() => {
            initBuildScreen();
            showScreen('build-screen');
        }, 1000);
    });
}

function connectToPeer() {
    const targetId = document.getElementById('target-peer-id').value.trim();
    if (!targetId) return alert("相手のIDを入力してください");
    conn = peer.connect(targetId);
    setupConnEvents();
}

function setupConnEvents() {
    conn.on('open', () => {
        document.getElementById('peer-status').innerText = "接続成功！ビルド画面へ移動します...";
        setTimeout(() => {
            initBuildScreen();
            showScreen('build-screen');
        }, 1000);
    });
    conn.on('data', data => {
        handlePeerData(data);
    });
}

// ビルド画面の更新
function initBuildScreen() {
    updateUI();
}

function getPartyTotalStars() {
    return monsters.reduce((sum, m) => sum + m.currentStars, 0);
}

function updateUI() {
    document.getElementById('remaining-pt').innerText = remainingPt;
    document.getElementById('party-stars').innerText = getPartyTotalStars();

    const container = document.getElementById('monster-cards-container');
    container.innerHTML = "";

    monsters.forEach((mon, monIdx) => {
        const card = document.createElement('div');
        card.className = 'monster-card';
        
        let slotsHtml = "";
        mon.slots.forEach((s, sIdx) => {
            slotsHtml += `
                <div class="slot-box slot-rarity-${s.rarity}">
                    <span class="badge badge-${s.rarity}">★${s.rarity}</span>
                    <strong>${s.ability}</strong>
                    <button style="float:right; padding:2px 6px; font-size:10px;" onclick="reroll(${monIdx}, ${sIdx})" ${remainingPt < REROLL_COST ? 'disabled' : ''}>リロール(1PT)</button>
                </div>
            `;
        });

        card.innerHTML = `
            <div style="margin-bottom: 10px;">
                <input type="text" value="${mon.name}" onchange="monsters[${monIdx}].name = this.value">
            </div>
            <div style="font-size:12px; color:#aaa; margin-bottom:8px;">
                現在の★: ${mon.currentStars} | スロット: ${mon.slots.length}/${MAX_SLOTS}<br>
                個体値: HP${mon.ivs.hp} A${mon.ivs.atk} D${mon.ivs.def} S${mon.ivs.spd}
            </div>
            <div style="margin-bottom: 10px;">
                <small>スキル追加 (★1=1PT / ★2=2PT / ★3=3PT / ★4=4PT):</small><br>
                ${[1,2,3,4].map(r => `
                    <button class="badge-${r}" onclick="buySlot(${monIdx}, ${r}, ${r})" 
                    ${!canBuySlot(mon, r) ? 'disabled' : ''}>+★${r}</button>
                `).join('')}
            </div>
            <div class="slots-container">
                ${slotsHtml}
            </div>
        `;
        container.appendChild(card);
    });
}

function canBuySlot(mon, rarity) {
    if (mon.slots.length >= MAX_SLOTS) return false;
    if (getPartyTotalStars() + rarity > MAX_PARTY_STARS) return false;
    if (remainingPt < rarity) return false;
    return true;
}

function buySlot(monIdx, rarity, cost) {
    const mon = monsters[monIdx];
    if (!canBuySlot(mon, rarity)) return;
    
    remainingPt -= cost;
    mon.currentStars += rarity;
    
    const pool = ABILITY_POOL[rarity];
    const pickedAbility = pool[Math.floor(Math.random() * pool.length)];

    mon.slots.push({ rarity: rarity, cost: cost, ability: pickedAbility });
    updateUI();
}

function reroll(monIdx, slotIdx) {
    if (remainingPt < REROLL_COST) return;
    
    const mon = monsters[monIdx];
    const slot = mon.slots[slotIdx];
    const pool = ABILITY_POOL[slot.rarity];

    let newAbility = slot.ability;
    if (pool.length > 1) {
        while (newAbility === slot.ability) {
            newAbility = pool[Math.floor(Math.random() * pool.length)];
        }
    }

    remainingPt -= REROLL_COST;
    slot.ability = newAbility;
    updateUI();
}

function finishBuild() {
    playerName = document.getElementById('player-name-input').value.trim() || "プレイヤー1";
    
    // モンスター名に変更がない（初期名のまま）場合、ランダム名を自動付与する
    monsters.forEach((mon, idx) => {
        const defaultName = `モンスター ${idx + 1}`;
        if (!mon.name || mon.name.trim() === "" || mon.name === defaultName) {
            mon.name = generateRandomMonsterName();
        }
    });

    playerTeam = monsters.map(m => buildBattleStats(m)).filter(m => m !== null);
    if (playerTeam.length === 0) return alert("最低1体のモンスターを構築してください！");

    isMyBuildReady = true;
    notifyBuildStatus();

    showScreen('pre-battle-room');

    const list = document.getElementById('starter-select-list');
    list.innerHTML = "";
    playerTeam.forEach((mon, idx) => {
        const div = document.createElement('div');
        div.className = `starter-card ${idx === 0 ? 'selected' : ''}`;
        div.id = `starter-card-${idx}`;
        div.onclick = () => selectStarter(idx);
        div.innerHTML = `<strong>${mon.name}</strong><br><small style="color:#aaa;">HP: ${mon.maxHp} | 攻撃: ${mon.atk}</small>`;
        list.appendChild(div);
    });
    selectedStarterIdx = 0;

    if (gameMode === "AI") {
        isOpponentBuildReady = true;
        enemyTeam = generateAITeam();
    }
}

function selectStarter(idx) {
    selectedStarterIdx = idx;
    document.querySelectorAll('.starter-card').forEach((c, i) => {
        c.classList.toggle('selected', i === idx);
    });
}

function buildBattleStats(mon) {
    let stats = {
        name: mon.name,
        hp: BASE_STATS.hp + mon.ivs.hp,
        maxHp: BASE_STATS.hp + mon.ivs.hp,
        atk: BASE_STATS.atk + mon.ivs.atk,
        def: BASE_STATS.def + mon.ivs.def,
        spd: BASE_STATS.spd + mon.ivs.spd,
        abilities: mon.slots.map(s => s.ability)
    };

    // アビリティによるステータス補正（固有効果系はバトルログ/計算側で処理）
    mon.slots.forEach(s => {
        const a = s.ability;
        if (a.includes("攻撃力+")) {
            let val = parseInt(a.match(/\+(\d+)%/)?.[1] || 0);
            stats.atk += Math.floor(BASE_STATS.atk * (val / 100));
        }
        if (a.includes("防御力+")) {
            let val = parseInt(a.match(/\+(\d+)%/)?.[1] || 0);
            stats.def += Math.floor(BASE_STATS.def * (val / 100));
        }
        if (a.includes("素早さ+")) {
            let val = parseInt(a.match(/\+(\d+)/)?.[1] || 0);
            stats.spd += val;
        }
        if (a.includes("HP+")) {
            let val = parseInt(a.match(/\+(\d+)%/)?.[1] || 0);
            let addHp = Math.floor(BASE_STATS.hp * (val / 100));
            stats.hp += addHp;
            stats.maxHp += addHp;
        }
    });

    return stats;
}

function generateAITeam() {
    const aiMonsters = [];
    for (let i = 0; i < 3; i++) {
        let m = {
            name: `AIモンスター ${i+1}`,
            currentStars: 2,
            slots: [
                { rarity: 2, ability: ABILITY_POOL[2][Math.floor(Math.random() * ABILITY_POOL[2].length)] }
            ],
            ivs: generateIVs()
        };
        aiMonsters.push(buildBattleStats(m));
    }
    return aiMonsters;
}

function setReadyToBattle() {
    isMyStarterReady = true;
    pActiveIdx = selectedStarterIdx;

    if (gameMode === "AI") {
        eActiveIdx = Math.floor(Math.random() * enemyTeam.length);
        startBattleScreen();
    } else {
        document.getElementById('btn-ready-battle').disabled = true;
        document.getElementById('pre-battle-status').innerText = "相手の接続・決定を待っています...";
        sendPeerData({ type: "STARTER_READY", starterIdx: selectedStarterIdx, team: playerTeam });
        checkStartBattle();
    }
}

function checkStartBattle() {
    if (isMyStarterReady && isOpponentStarterReady) {
        startBattleScreen();
    }
}

function startBattleScreen() {
    showScreen('battle-screen');
    appendLog("--- バトル開始！ ---");
    updateBattleUI();
}

function updateBattleUI() {
    const pMon = playerTeam[pActiveIdx];
    const eMon = enemyTeam[eActiveIdx];

    document.getElementById('my-mon-name').innerText = pMon.name;
    document.getElementById('my-mon-stats').innerText = `攻撃:${pMon.atk} 防御:${pMon.def} 素早さ:${pMon.spd}`;
    document.getElementById('my-hp-text').innerText = `${pMon.hp} / ${pMon.maxHp}`;
    document.getElementById('my-hp-bar').style.width = `${Math.max(0, (pMon.hp / pMon.maxHp) * 100)}%`;

    document.getElementById('enemy-mon-name').innerText = eMon.name;
    document.getElementById('enemy-mon-stats').innerText = `攻撃:${eMon.atk} 防御:${eMon.def} 素早さ:${eMon.spd}`;
    document.getElementById('enemy-hp-text').innerText = `${eMon.hp} / ${eMon.maxHp}`;
    document.getElementById('enemy-hp-bar').style.width = `${Math.max(0, (eMon.hp / eMon.maxHp) * 100)}%`;

    // ボタンの非活性化
    const isMyTurnActive = (pMon.hp > 0);
    document.getElementById('btn-attack').disabled = !isMyTurnActive;
    document.getElementById('btn-switch').disabled = !isMyTurnActive;
}

function appendLog(msg) {
    const logBox = document.getElementById('battle-log');
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerText = msg;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
}

// アクション処理
function handleAction(actionType, targetMonIdx = null) {
    const action = { type: actionType, switchTarget: targetMonIdx };
    
    if (gameMode === "AI") {
        mySubmittedAction = action;
        // AIのアクション（基本攻撃、死にそうなら交代など）
        let aiAction = { type: 'attack' };
        executeTurn(mySubmittedAction, aiAction);
    } else {
        mySubmittedAction = action;
        document.getElementById('btn-attack').disabled = true;
        document.getElementById('btn-switch').disabled = true;
        sendPeerData({ type: "ACTION", action: action });
        
        if (opponentSubmittedAction) {
            executeTurn(mySubmittedAction, opponentSubmittedAction);
            mySubmittedAction = null;
            opponentSubmittedAction = null;
        } else {
            appendLog("相手のアクション選択を待っています...");
        }
    }
}

function executeTurn(pAction, eAction) {
    appendLog(`=== ターン ${currentTurn} ===`);

    const pMon = playerTeam[pActiveIdx];
    const eMon = enemyTeam[eActiveIdx];

    // 交代判定（交代は最優先）
    if (pAction.type === 'switch') {
        pActiveIdx = pAction.switchTarget;
        appendLog(`${playerName} は ${playerTeam[pActiveIdx].name} に交代した！`);
    }
    if (eAction.type === 'switch') {
        eActiveIdx = eAction.switchTarget;
        appendLog(`相手は ${enemyTeam[eActiveIdx].name} に交代した！`);
    }

    // 両者攻撃の場合、素早さ順
    if (pAction.type === 'attack' && eAction.type === 'attack') {
        const pFirst = pMon.spd >= eMon.spd;
        if (pFirst) {
            resolveAttack(pMon, eMon, true);
            if (eMon.hp > 0) resolveAttack(eMon, pMon, false);
        } else {
            resolveAttack(eMon, pMon, false);
            if (pMon.hp > 0) resolveAttack(pMon, eMon, true);
        }
    } else if (pAction.type === 'attack' && eAction.type !== 'attack') {
        resolveAttack(pMon, enemyTeam[eActiveIdx], true);
    } else if (eAction.type === 'attack' && pAction.type !== 'attack') {
        resolveAttack(eMon, playerTeam[pActiveIdx], false);
    }

    currentTurn++;
    updateBattleUI();
    checkBattleEnd();
}

function resolveAttack(attacker, defender, isPlayerAttacker) {
    let damage = Math.max(1, attacker.atk - Math.floor(defender.def / 2));
    defender.hp = Math.max(0, defender.hp - damage);
    
    appendLog(`${attacker.name} の攻撃！ ${defender.name} に ${damage} のダメージ！`);

    // アビリティ（吸血など）のシンプル適用例
    attacker.abilities.forEach(a => {
        if (a.includes("吸血") || a.includes("ドレイン")) {
            let heal = Math.floor(damage * 0.2);
            attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
            appendLog(`  └ ${attacker.name} は吸血効果で HPが ${heal} 回復！`);
        }
    });
}

function openSwitchMenu() {
    const list = document.getElementById('switch-list');
    list.innerHTML = "";
    playerTeam.forEach((mon, idx) => {
        if (idx !== pActiveIdx && mon.hp > 0) {
            const btn = document.createElement('button');
            btn.innerText = `${mon.name} (HP:${mon.hp})`;
            btn.onclick = () => {
                closeSwitchMenu();
                handleAction('switch', idx);
            };
            list.appendChild(btn);
        }
    });
    document.getElementById('switch-menu').style.display = "block";
}

function closeSwitchMenu() {
    document.getElementById('switch-menu').style.display = "none";
}

function checkBattleEnd() {
    const pAlive = playerTeam.some(m => m.hp > 0);
    const eAlive = enemyTeam.some(m => m.hp > 0);

    if (!pAlive || !eAlive) {
        document.getElementById('battle-controls').style.display = "none";
        if (!pAlive && !eAlive) {
            appendLog("【決着】引き分けです！");
        } else if (pAlive) {
            appendLog(`【決着】${playerName} の勝利！`);
        } else {
            appendLog("【決着】相手の勝利...");
        }
    } else if (playerTeam[pActiveIdx].hp <= 0) {
        appendLog(`${playerTeam[pActiveIdx].name} は倒れた！交代先を選んでください。`);
        openSwitchMenu();
    }
}

// 通信処理
function sendPeerData(data) {
    if (conn && conn.open) {
        conn.send(data);
    }
}

function notifyBuildStatus() {
    if (gameMode === "PEER") {
        sendPeerData({ type: "BUILD_READY" });
    }
}

function handlePeerData(data) {
    if (data.type === "BUILD_READY") {
        isOpponentBuildReady = true;
    } else if (data.type === "STARTER_READY") {
        isOpponentStarterReady = true;
        enemyTeam = data.team;
        eActiveIdx = data.starterIdx;
        checkStartBattle();
    } else if (data.type === "ACTION") {
        opponentSubmittedAction = data.action;
        if (mySubmittedAction) {
            executeTurn(mySubmittedAction, opponentSubmittedAction);
            mySubmittedAction = null;
            opponentSubmittedAction = null;
        }
    }
}
</script>
