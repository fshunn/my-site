<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>選択条件に応じた完全消去・再出現の例</title>
  <style>
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>
<body>

<h3>2個選んだらチェックボックスごと消滅（解除で再出現）</h3>
<div id="container" class="item-list"></div>

<script>
// 選択対象データ
const items = [
  { id: '1', label: '選択肢 A' },
  { id: '2', label: '選択肢 B' },
  { id: '3', label: '選択肢 C' },
  { id: '4', label: '選択肢 D' }
];

// 現在選択されているIDの集合
let selectedIds = new Set();

const container = document.getElementById('container');

function render() {
  container.innerHTML = ''; // 一旦クリアして再描画

  const isLimitReached = selectedIds.size >= 2;

  items.forEach(item => {
    const isSelected = selectedIds.has(item.id);

    // 2個選択されていて、かつ自身が「選択済み」の場合はDOM自体をレンダリングしない（消滅させる）
    if (isLimitReached && isSelected) {
      return; 
    }

    const wrapper = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = isSelected;

    checkbox.addEventListener('change', (e) => {
      if (e.target.checked) {
        selectedIds.add(item.id);
      } else {
        selectedIds.delete(item.id);
      }
      // 状態変更後に再描画（これにより選んだものが消えたり、解除で戻ったりする）
      render();
    });

    wrapper.appendChild(checkbox);
    wrapper.appendChild(document.createTextNode(' ' + item.label));
    container.appendChild(wrapper);
  });

  // （確認用）解除機能などのテスト用ボタン
  if (selectedIds.size > 0) {
    const resetBtn = document.createElement('button');
    resetBtn.style.marginTop = '10px';
    resetBtn.textContent = `選択をすべて解除（現在${selectedIds.size}個選択中）`;
    resetBtn.onclick = () => {
      selectedIds.clear();
      render();
    };
    container.appendChild(resetBtn);
  }
}

// 初回呼び出し
render();
</script>

</body>
</html>
